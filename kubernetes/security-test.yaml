apiVersion: apps/v1
kind: Deployment

metadata:
  name: security-test
  labels:
    app: security-test
    security-demo: "true"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: security-test

  template:
    metadata:
      labels:
        app: security-test
        security-demo: "true"

    spec:
      containers:
        - name: security-test
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Security test workload started"
              while true; do
                sleep 30
              done